name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.0"

      - name: Check Swift version
        run: swift --version

      - name: Ensure scripts are executable
        run: chmod +x ./scripts/build-app-bundle

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: |
          ./scripts/build-app-bundle --version "${{ steps.version.outputs.version }}" --build "$GITHUB_RUN_NUMBER"

      - name: Package DMG
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="CodexTrafficLight-macos-arm64-${VERSION}.dmg"
          hdiutil create \
            -volname "CodexTrafficLight" \
            -srcfolder ".build/CodexTrafficLight.app" \
            -ov -format UDZO \
            "$DMG_NAME"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.dmg_name }}
          generate_release_notes: true
